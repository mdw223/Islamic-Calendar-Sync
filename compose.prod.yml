# Production (Contabo shared VPS): API + data stores only.
# TLS / public HTTP: host nginx owns 80/443 — see deploy/nginx/ and /root/docs/vps-edge-proxy.md
# Local dev full stack still uses compose.yml + proxy/nginx.conf
#
# Set API_DOMAIN in .env.prod (e.g. api.yourdomain.com).
# Legacy single-project VPS: uncomment the `proxy` service below and use
# proxy/nginx.prod.https.template (Docker nginx terminates TLS on 80/443).
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_service_prod
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.prod
    restart: unless-stopped
    depends_on:
      - database
      - redis

  # Contabo multi-project: host nginx owns 443. Uncomment for a dedicated VPS
  # where this stack terminates TLS (mounts letsencrypt + nginx.prod.https.template).
  # proxy:
  #   image: nginx:latest
  #   container_name: nginx_proxy_prod
  #   env_file:
  #     - .env.prod
  #   volumes:
  #     - ./proxy/nginx.prod.https.template:/etc/nginx/templates/default.conf.template:ro
  #     - ./certbot/www:/var/www/certbot:rw
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - api
  #   # Also publish 80/443 on a dedicated box, e.g.:
  #   # ports:
  #   #   - "80:80"
  #   #   - "443:443"

  redis:
    image: redis:latest
    container_name: ics_redis_prod
    # Not published: API reaches Redis on the internal Docker network only.
    restart: unless-stopped

  database:
    image: postgres:15
    container_name: ics_postgres_db_prod
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:5432:5432" # only localhost can access this port
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./Sql.Migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_prod_data:
    driver: local
