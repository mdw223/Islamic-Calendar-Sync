# Host-nginx site for Contabo multi-project gateway.
# Install: sudo cp deploy/nginx/api.islamiccalendarsync.com.conf /etc/nginx/sites-available/api.islamiccalendarsync.com
# Then: sudo nginx -t && sudo systemctl reload nginx
# See /root/docs/vps-edge-proxy.md
#
# Legacy (Docker nginx on 80/443): IslamicCalendarSync/proxy/nginx.prod.https.template + compose.prod.yml proxy service.

server {
    listen 80;
    listen [::]:80;
    server_name api.islamiccalendarsync.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.islamiccalendarsync.com;

    ssl_certificate /etc/letsencrypt/live/api.islamiccalendarsync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.islamiccalendarsync.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding gzip;

        proxy_pass http://127.0.0.1:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","message":"This host only serves the API under /api."}';
    }
}
