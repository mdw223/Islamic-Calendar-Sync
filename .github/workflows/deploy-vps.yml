name: Deploy to VPS

# Required repo secrets (Actions → VPS SSH; see _wiki/deployment_guide.md §15):
#   VPS_HOST, VPS_USER, VPS_DEPLOY_PATH, VPS_SSH_KEY (private key; NOT the VPS→GitHub deploy key)
on:
  workflow_dispatch: # Manual trigger (you click "Run workflow" in GitHub UI)
  push:
    branches: [main] # Runs on any push to main (includes merges)

permissions: {} # No GITHUB_TOKEN permissions needed; SSH key used for deployment

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: 22  # uncomment if SSH is not on the default port
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull
            docker compose -f compose.prod.yml up --build -d
            docker image prune -f
